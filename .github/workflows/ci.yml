name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q boil tests tools run.py
      - name: Check Python 3.10 is still the floor
        # CI 矩阵跑 3.10 与 3.12，但"只用旧版本有的东西"这件事得有人盯着：
        # 一条 3.11+ 的写法在 3.12 的 job 上永远不会红，只会在 3.10 上炸成一堆 traceback。
        run: |
          pip install --quiet vermin
          vermin --target=3.10- --no-parse-comments --backport typing boil tests tools run.py
      - name: Check frontend syntax
        run: |
          set -e
          find static/js -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done
      - name: Unit and integration tests
        # 临时数据目录：防止某个测试把假密钥/假配置写进仓库的 data/
        run: BOIL_DATA_DIR=$(mktemp -d) python -m unittest discover -s tests -v
