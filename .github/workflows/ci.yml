name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q boil tests tools run.py
      - name: Check frontend syntax
        run: |
          set -e
          find static/js -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --input-type=module --check < "$f"
          done
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
